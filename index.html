<title>Mike Lifts</title>
<style>
:root{--bg:#0d0e12;--card:#16171c;--card2:#22242b;--line:#272930;--text:#f3f4f6;--muted:#8a8f9b;--good:#22c58b;--day:#3d7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));min-height:100vh}
.bgdate{position:fixed;top:calc(env(safe-area-inset-top) - 14px);right:-8px;z-index:0;pointer-events:none;text-align:right;line-height:.82;color:var(--day);opacity:.18;transition:color .4s}
.bgdate b{display:block;font-size:200px;font-weight:900;letter-spacing:-12px}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:30px;margin:4px 0 2px;letter-spacing:-.8px;font-weight:800}
h2{font-size:12px;margin:26px 2px 8px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.day-t{color:var(--day)}

.btn{appearance:none;border:0;border-radius:14px;padding:12px 14px;font:600 16px inherit;font-family:inherit;color:var(--text);background:var(--card2);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}

.btn.ghost{background:transparent;color:var(--muted)}.btn.block{width:100%;display:block}.btn.sm{padding:7px 10px;font-size:14px;border-radius:10px}
.btn.daybtn{border-left:4px solid var(--c);text-align:left}

.hero .lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}

.hero .ex{font-size:13px;line-height:1.55}.hero .ex span{opacity:.7}
.hero .go{margin-top:14px;width:100%;background:#fff;color:#111;font-weight:800;font-size:18px;padding:15px;border-radius:16px;border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}.stat span{font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--day);border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--card2);color:var(--muted)}
.badge.up{background:rgba(34,197,139,.14);color:var(--good)}
.tier{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border-radius:6px;vertical-align:2px}
.tier.main{background:var(--day);color:#fff}.tier.acc{border:1px solid #3a3d46;color:#b6bac4}.tier.opt{border:1px dashed #3a3d46;color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 6px}
.sect b{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text)}.sect span{font-size:12px;color:var(--muted)}
.cue{font-size:12.5px;color:var(--muted);margin-top:6px;padding-left:9px;border-left:2px solid var(--day)}
.exname{font-size:18px;font-weight:800;letter-spacing:-.3px}
.region{font-size:12px;color:var(--muted);margin-top:1px}
.ex-card.complete{border-color:rgba(34,197,139,.45)}
.ex-card.complete .exname{color:var(--good)}
.ss{border-left:3px solid var(--day);padding-left:10px;margin:12px 0}
.ss .sslbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--day)}
.ss .card{margin:8px 0}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{padding:4px 3px;text-align:center}th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
td input{width:100%;background:var(--card2);border:1px solid transparent;color:var(--text);border-radius:12px;padding:10px 4px;font:700 17px inherit;font-family:inherit;text-align:center}
td input:focus{outline:none;border-color:var(--day)}
tr.done td input{background:rgba(34,197,139,.12);color:var(--good)}
.chk{width:46px;height:42px;border-radius:12px;border:0;background:var(--card2);color:var(--muted);font-size:20px;font-weight:800}
tr.done .chk{background:var(--good);color:#04140d;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,14,18,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:none;border:0;color:var(--muted);font:600 11px inherit;font-family:inherit;padding:6px 0}
nav button.on{color:var(--day)}nav svg{display:block;margin:0 auto 3px;width:24px;height:24px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--day);color:#fff;border-radius:18px;padding:10px 12px;display:none;z-index:11;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}

#rest>.row{position:relative}
#rest.go{background:var(--good);color:#04140d}
#rest .t{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;min-width:92px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .card{width:100%;max-width:420px;text-align:center;animation:drop2 .35s cubic-bezier(.3,1.4,.5,1)}

input.f,select.f,textarea.f{width:100%;background:var(--card2);border:0;color:var(--text);border-radius:12px;padding:11px;font:16px inherit;font-family:inherit}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.hist-sets{font-size:14px;color:var(--muted);margin-top:8px}

.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.ring circle.p{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.timer{font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--text);letter-spacing:1px;text-transform:uppercase}
.swap{background:var(--card2);border:0;color:var(--text);border-radius:9px;padding:5px 8px;font-size:13px;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.modal .plist{max-height:48vh;overflow:auto;text-align:left;margin-top:8px}
.plist button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:10px 4px;font:600 15px inherit;font-family:inherit}
.plist small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.plh{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--day);margin:10px 4px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}.chips .on{background:var(--day);color:#fff}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

</head>

 {id:'A',name:'A · Squat + Incline',color:'#3d7bff',exercises:[

const KEY='mikelifts.v1';

 <h2>Holding muscle?</h2><div class="card">${ret.str!=null&&ret.bw!=null?`<div class="row between"><span class="muted">Bodyweight, 5 wk</span><b>${sgn(ret.bw)}%</b></div><div class="row between"><span class="muted">Main-lift strength, 5 wk</span><b>${sgn(ret.str)}%</b></div>
  <p class="small" style="margin:8px 0 0">${ret.str>=0&&ret.bw<0?'Strength up while weight drops: you’re keeping muscle while cutting fat.':ret.str<-3?'Strength dropping. Check protein, sleep and how fast you’re losing.':'Holding steady.'}</p>`:'<p class="muted small" style="margin:0">Needs a few weeks of logged sessions and weigh-ins. This is the key signal on a cut: weight down, strength flat or up.</p>'}</div>
 <h2>Bodyweight trend</h2><div class="card">${bt?`<div class="row between"><span class="muted">Trend weight</span><b>${bt.last.toFixed(1)} kg</b></div>${bt.kgWk!=null?`<div class="row between"><span class="muted">Rate</span><b>${sgn(bt.kgWk,2)} kg/wk (${sgn(bt.pctWk,2)}%)</b></div>`:''}
  <div style="margin-top:8px">${spark(bt.series.map(p=>+p.t.toFixed(1)),bt.series.map(p=>d(p.date)))}</div>`:''}<p class="small" style="margin:8px 0 0">${bwMsg}</p></div>
 <h2>Waist → ${S.settings.goalWaist}"</h2><div class="card">${spark(wa.map(b=>b.waist),wa.map(b=>d(b.date)))}
  <p class="small" style="margin:8px 0 0">${!wp?'Log waist weekly for a projection.':wp.eta?`At ${wp.slopeWk.toFixed(2)}"/week you reach ${S.settings.goalWaist}" around <b>${wp.eta.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</b> ${wp.eta<=new Date(S.settings.goalDate)?'<span class="day-t">ahead of target</span>':'(after target date)'}.`:'Waist isn’t trending down yet.'}</p></div>
 <h2>Sets per muscle, last 7 days</h2><div class="card">${MUSCLE_TARGETS.map(([m,lo,hi])=>{const v=ws[m]||0,col=v<lo?'#e5a50a':v<=hi?'var(--good)':'var(--day)';
  return `<div style="margin:7px 0"><div class="row between small"><span>${m}</span><span class="muted">${+v.toFixed(1)} / ${lo}–${hi}</span></div><div class="bar" style="height:6px;position:relative"><i style="width:${Math.min(100,v/(hi*1.2)*100)}%;background:${col}"></i></div></div>`}).join('')}
  <p class="muted small" style="margin:8px 0 0">Direct sets count 1, secondary muscles 0.5: the counting that fit best in the largest volume meta-analysis (Pelland et al., 67 studies). More sets keep adding growth with diminishing returns past ~10–12/week; ~4 hard sets is the minimum that clearly works, and enough to hold muscle on a cut.</p></div>
 <h2>Lifts</h2><div class="card">${exs.length?exs.map(s=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><div><b>${esc(s.name)}</b><div class="muted small">e1RM ${Math.round(s.last.v)} · best ${Math.round(s.best)} · ${s.n} sessions</div></div>
  <div style="text-align:right"><span class="tier ${s.status==='Stalled'?'acc':'main'}">${s.status}</span><div class="small ${s.trend>0?'day-t':'muted'}">${sgn(s.trend,1)} kg/wk</div></div></div>
  ${s.status==='Stalled'?`<p class="small muted" style="margin:4px 0 6px">No new best in ${s.since} sessions. Try a lighter week (−10%) or swap to a variation.</p>`:''}`).join(''):'<p class="muted small" style="margin:0">Log a workout first.</p>'}</div>
 <h2>Strength chart (est. 1RM)</h2><div class="card">${names.length?`<select class="f" id="progEx">${names.map(n=>`<option ${n===progEx?'selected':''}>${esc(n)}</option>`).join('')}</select>
 <div style="margin-top:10px">${spark(pts.map(p=>p.v),pts.map(p=>p.d))}</div>`:'<p class="muted small">Log a workout first.</p>'}</div>
 <h2>Log body</h2><div class="card"><div class="row"><input class="f" id="bw" inputmode="decimal" placeholder="Weight kg">
 <input class="f" id="bwa" inputmode="decimal" placeholder='Waist "'><button class="btn primary" data-act="body-add">Save</button></div>
 <p class="muted small" style="margin:8px 0 0">Weigh in the morning, same conditions. The trend smooths out daily water swings.</p></div>
 ${S.body.length?`<h2>Entries</h2><div class="card small">${[...S.body].reverse().slice(0,12).map(b=>`<div class="row between" style="padding:3px 0"><span>${d(b.date)}</span><span>${b.weight?+(+b.weight).toFixed(2)+' kg':''} ${b.waist?+(+b.waist).toFixed(2)+'"':''}</span><button class="btn ghost sm" data-act="body-del" data-id="${b.date}">✕</button></div>`).join('')}</div>`:''}`}

function vSet(){const st=S.settings;
 return `<h1>Settings</h1><div class="card">
 ${[['name','Name','text'],['weeklyGoal','Weekly session goal','number'],['startWaist','Start waist (")','number'],['goalWaist','Goal waist (")','number'],['goalDate','Goal date','date']]
 .map(([k,l,t])=>`<label class="small muted">${l}</label><input class="f" style="margin:4px 0 10px" type="${t}" data-set="${k}" value="${esc(st[k])}">`).join('')}</div>
 <h2>Calories & Apple Health</h2><div class="card">
 <label class="small muted">Calorie source</label><select class="f" style="margin:4px 0 10px" data-set="kcalMode"><option value="estimate" ${st.kcalMode==='estimate'?'selected':''}>Estimate in app</option><option value="off" ${st.kcalMode==='off'?'selected':''}>Off (tracked by Whoop / watch)</option></select>
 <label class="small muted">Bodyweight fallback (kg, used until you log weight)</label><input class="f" style="margin:4px 0 10px" type="number" data-set="bw" value="${esc(st.bw)}">
 <label class="small muted">Incline walk speed (km/h)</label><input class="f" style="margin:4px 0 10px" type="number" data-set="walkSpeed" value="${esc(st.walkSpeed)}">
 <label class="small muted">Shortcut name</label><input class="f" style="margin:4px 0 10px" type="text" data-set="shortcut" value="${esc(st.shortcut)}">
 <details><summary class="small day-t" style="font-weight:700">How to set up the Health Shortcut (one-time)</summary>
 <ol class="small muted" style="padding-left:18px;margin:8px 0 0">
 <li>Open the <b>Shortcuts</b> app → <b>+</b> → name it exactly as above.</li>
 <li>Tap the <b>ⓘ</b> → enable <b>Receive</b> input of type <b>Text</b> from <b>Share Sheet/Apps</b>.</li>
 <li>Add action <b>Get Numbers from Input</b> (input: Shortcut Input).</li>
 <li>Add action <b>Log Health Sample</b> → Type <b>Active Energy</b> → Value: <b>Numbers</b>, unit <b>kcal</b>.</li>
 <li>After a session, tap <b>Log to Apple Health</b>. Allow Health access the first time, then swipe back to the app.</li></ol>
 <p class="small muted">Estimate: lifting ≈ 5 METs, incline walk via the ACSM walking equation, bike ≈ 6 METs, counted as active (above-resting) kcal. Expect ±25%. If you get a Whoop, switch to Off so calories aren’t counted twice.</p></details></div>
 <h2>Backup</h2><div class="card"><p class="muted small" style="margin-top:0">Data lives only on this phone. Export now and then.</p>
 <div class="row"><button class="btn" data-act="export">Export</button><label class="btn">Import<input type="file" accept=".json" id="imp" hidden></label></div></div>
 <h2>Presets</h2>${S.templates.map(t=>`<div class="card"><b><span class="dot" style="--c:${t.color}"></span>${esc(t.name)}</b>
 ${t.exercises.map((x,i)=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><div><div>${esc(x.name)}</div><div class="muted small">${x.tier?TIERS[x.tier][0]+' · ':''}${x.sets} × ${x.repMin===x.repMax?x.repMin:x.repMin+'–'+x.repMax}${x.ss?' · superset '+esc(x.ss):''}</div></div>
  <div class="row" style="gap:4px"><button class="swap" data-act="pk-open" data-m="swap" data-t="${t.id}" data-e="${i}">⇄</button><button class="btn ghost sm" data-act="tex-del" data-t="${t.id}" data-e="${i}">✕</button></div></div>`).join('')}
 <button class="btn sm" style="margin-top:8px" data-act="pk-open" data-m="add" data-t="${t.id}">+ Add exercise</button></div>`).join('')}
 <details class="card"><summary class="small day-t" style="font-weight:700">Advanced: edit presets as JSON</summary><p class="muted small">Swaps during a workout are remembered automatically. Fields: tier (main/acc/opt), ss (superset group), sets, repMin/repMax, rest (sec), inc (kg), kind, alts, color. Rotation: A → B.</p>
 <textarea class="f" id="tpls" rows="14" style="font:12px ui-monospace,monospace">${esc(JSON.stringify(S.templates,null,1))}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn primary" data-act="tpl-save">Save presets</button><button class="btn ghost" data-act="tpl-reset">Reset</button></div></details>
 <button class="btn ghost block" data-act="wipe" style="margin-top:16px;color:#ff5c7a">Erase all data</button>`}

// ================= timers =================
function tickRest(){const a=S.active,el=$('#rest');
 if(a){const e=$('#elapsed');if(e)e.textContent=fmtT((Date.now()-a.start)/1000)}
 if(!a||!a.restEnd){el.style.display='none';return}
 const left=(a.restEnd-Date.now())/1000;el.style.display='block';
 if(left>0){el.classList.remove('go');$('#restT').textContent=fmtT(left);$('#restL').textContent='Rest · '+(a.restLabel||'');$('#restF').style.width=(1-left/(a.restDur||1))*100+'%'}
 else{el.classList.add('go');$('#restF').style.width='0';$('#restT').textContent='GO';$('#restL').textContent='Next set. Make it count.';
  if(!restAlerted){restAlerted=true;beep()}
  if(left<-20){a.restEnd=0;save();el.style.display='none'}}}
setInterval(tickRest,250);

// ================= events =================
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.f&&S.active){const ex=S.active.exercises[t.dataset.e];ex.sets[t.dataset.s][t.dataset.f]=t.value.replace(',','.');
  if(t.dataset.f==='w'){for(let j=+t.dataset.s+1;j<ex.sets.length;j++)if(!ex.sets[j].done){ex.sets[j].w=t.value;const i=document.querySelector(`input[data-e="${t.dataset.e}"][data-s="${j}"][data-f="w"]`);if(i)i.value=t.value}}
  save()}
 if(t.id==='pq'&&pk){pk.q=t.value;renderPick()}
 if(t.dataset.set){S.settings[t.dataset.set]=t.type==='number'?+t.value:t.value;save()}});
document.addEventListener('change',ev=>{if(ev.target.tagName==='SELECT'&&ev.target.dataset.set){S.settings[ev.target.dataset.set]=ev.target.value;save()}if(ev.target.id==='progEx'){progEx=ev.target.value;render()}
 if(ev.target.id==='imp'){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.sessions)throw 0;S={...defaults(),...d};save();toast('Imported');render()}catch(e){alert('Not a valid backup file')}})}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act],[data-tab]');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0);return}
 const act=b.dataset.act,a=S.active,ei=+b.dataset.e,si=+b.dataset.s;
 switch(act){
 case 'start':if(S.active&&!confirm('A workout is already running. Replace it?'))return;start(b.dataset.id);break;
 case 'start-bw':{const p=bwPlan();if(p)start('BW',p.picks.map(x=>x.x.name));break}
 case 'check':{const e=a.exercises[ei],x=e.sets[si],k=kindOf(e);x.done=!x.done;
  if(x.done){if(x.r==='')x.r=e.repMin;if(x.w==='')x.w=0;
   if(k==='lift'){const prev=bestE1(e.name),v=e1rm(num(x.w),num(x.r));
    if(prev>0&&v>prev+.01&&!e.sets.some((y,jj)=>jj!==si&&y.done&&e1rm(num(y.w),num(y.r))>=v)){toast(`New PR · ${e.name} ${x.w}×${x.r}`);confetti(90)}}
   const partner=e.ss?a.exercises.find((o,ii)=>ii!==ei&&o.ss===e.ss):null,allDone=e.sets.every(y=>y.done);
   if(partner&&partner.sets[si]&&!partner.sets[si].done){a.restEnd=0;toast(`Now: ${partner.name}`)}
   else if(allDone&&(!partner||partner.sets.every(y=>y.done))&&ei>=a.exercises.length-1)a.restEnd=0;
   else{const r=Math.max(e.rest,partner?partner.rest:0),fin=allDone&&(!partner||partner.sets.every(y=>y.done));startRest(fin?Math.min(r,90):r,fin?'next exercise':(partner?'superset':e.name))}}
  save();render();break}
 case 'pk-open':openPick(b.dataset.m,ei,b.dataset.t);break;
 case 'pk-reg':pk.r=b.dataset.r;renderPick();break;
 case 'pick':if(doPick(b.dataset.n))b.closest('.modal').remove();break;
 case 'split':if(doPick(null))b.closest('.modal').remove();break;
 case 'tex-del':{const t=S.templates.find(t=>t.id===b.dataset.t);if(confirm('Remove '+t.exercises[ei].name+' from '+t.name+'?')){t.exercises.splice(ei,1);save();render()}break}
 case 'set-add':{const s=a.exercises[ei].sets,l=s[s.length-1]||{w:'',r:''};s.push({w:l.w,r:l.r,done:false});save();render();break}
 case 'set-del':a.exercises[ei].sets.pop();save();render();break;
 case 'ex-del':if(confirm('Remove '+a.exercises[ei].name+'?')){a.exercises.splice(ei,1);save();render()}break;
 case 'finish':finish();break;
 case 'cancel':if(confirm('Discard this workout?')){S.active=null;save();keepAwake(false);render()}break;
 case 'rest-15':a.restEnd-=15000;save();tickRest();break;
 case 'rest+15':a.restEnd=Math.max(a.restEnd,Date.now())+15000;a.restDur+=15;restAlerted=false;save();tickRest();break;
 case 'rest-skip':a.restEnd=0;save();tickRest();break;
 case 'close-modal':b.closest('.modal').remove();break;
 case 'sess-del':if(confirm('Delete this session?')){S.sessions=S.sessions.filter(s=>s.id!=b.dataset.id);save();render()}break;
 case 'body-add':{const w=num($('#bw').value.replace(',','.')),wa=num($('#bwa').value.replace(',','.'));if(w==null&&wa==null)return;
  S.body.push({date:Date.now(),weight:w,waist:wa});save();toast('Logged');render();break}
 case 'body-del':S.body=S.body.filter(x=>x.date!=b.dataset.id);save();render();break;
 case 'export':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),name=`lifts-backup-${new Date().toISOString().slice(0,10)}.json`,f=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
  else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}break}
 case 'csv-sets':share(csvSets(),`lifts-sets-${isoD(Date.now())}.csv`,'text/csv');break;
 case 'csv-ex':share(csvExercises(),`lifts-exercises-${isoD(Date.now())}.csv`,'text/csv');break;
 case 'csv-wk':share(csvWeekly(),`lifts-weekly-${isoD(Date.now())}.csv`,'text/csv');break;
 case 'health':sendToHealth(b.dataset.k);break;
 case 'tpl-save':try{const t=JSON.parse($('#tpls').value);if(!Array.isArray(t))throw 0;S.templates=t;save();toast('Presets saved');render()}catch(e){alert('Invalid JSON')}break;
 case 'tpl-reset':if(confirm('Reset presets to default?')){S.templates=JSON.parse(JSON.stringify(PRESETS));save();render()}break;
 case 'wipe':if(confirm('Erase ALL data? Export first if unsure.')){localStorage.removeItem(KEY);S=defaults();render()}break;
 }});
if(S.active)keepAwake(true);
render();
</script>
</body>
</html>
